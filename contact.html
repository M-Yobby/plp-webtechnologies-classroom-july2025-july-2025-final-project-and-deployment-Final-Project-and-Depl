<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ABC Law Firm — Contact</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" class="logo"><img src="images/ABC_logo.png" alt="ABC Law Firm"></a>
    <nav class="site-nav" id="main-nav">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="contact.html">Contact</a></li>
    </nav>
  </div>
</header>

<main class="container">
  <h1>Contact Us</h1>
  <form id="contact-form">
    <label>Name:<br>
      <input type="text" name="name" required>
    </label>
    <label>Email:<br>
      <input type="email" name="email" required>
    </label>
    <label>Message:<br>
      <textarea name="message" rows="5" required></textarea>
    </label>
    <button type="submit" class="btn">Send Message</button>
  </form>

  <section class="map">
  <h2>Our Location</h2>
  <iframe 
    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3609.717457270812!2d36.78250247448291!3d-1.2507227355872659!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x182f17c341815e9b%3A0x75dbfd0bd034f43b!2sPower%20Learn%20Project!5e1!3m2!1sen!2ske!4v1758544352883!5m2!1sen!2ske" 
    width="100%" 
    height="300" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" 
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>
</section>
</main>

<footer class="site-footer">
  <div class="container">
    <p>© 2025 ABC Law Firm</p>
  </div>
</footer>

<script src="js/main.js"></script>
</body>
</html>
